<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Insarmaps - Matrix View</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }
        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #666;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div id="shared-view-loading" class="loading">Loading shared viewer...</div>
    <script>
        // overlay.html is the single viewer implementation. Because document.write()
        // replaces this document without navigating, its code sees matrix.html as the
        // current pathname and enables matrix layout while preserving the URL hash.
        fetch('overlay.html', { cache: 'no-store' })
            .then((response) => {
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                return response.text();
            })
            .then((html) => {
                document.open();
                document.write(html);
                document.close();
            })
            .catch((error) => {
                document.getElementById('shared-view-loading').textContent =
                    `Could not load overlay.html: ${error.message}`;
            });
    </script>
</body>
</html>
